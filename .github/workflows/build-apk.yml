# Compila o APK nos servidores do GitHub (não precisa de Android SDK no PC).
# O APK fica disponível na aba "Actions" do repositório, em "Artifacts".
name: Gerar APK

on:
  workflow_dispatch: # permite rodar manualmente pelo botão "Run workflow"
  push:
    branches: [main, "feature/**"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v5
        with:
          name: localizacoes-apk
          path: build/app/outputs/flutter-apk/app-release.apk
